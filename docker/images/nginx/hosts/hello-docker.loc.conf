server {
    listen 80;
    #listen 443 ssl http2;
	
    server_name hello-docker.loc;

    index index.html index.htm index.php;

    charset utf-8;
    sendfile off;
    client_max_body_size 128m;

	error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    #root /var/www/api-server;
	root /var/www/api-server/public;

    add_header Access-Control-Expose-Headers Accept-Ranges;
    add_header Access-Control-Expose-Headers Content-Encoding;
    add_header Access-Control-Expose-Headers Content-Length;
    add_header Access-Control-Expose-Headers Content-Range;
    add_header accept_ranges bytes;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
	
	location /app {
	  # alias /var/www/api-client/dist/api-client/browser;
	  alias /var/www/api-client;
      try_files $uri $uri/ /index.html = 404;
    }

	location / {
      try_files $uri $uri/ /index.php?$query_string;
    }
	
    location ~ \.php$ {
		set $new_url $request_uri;
	
        # fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass cm-api-server:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		fastcgi_param PHP_VALUE "upload_max_filesize=128M \n post_max_size=128M";
		fastcgi_param REQUEST_URI $new_url;
    }


    location ~ /\.ht {
        deny all;
    }

}